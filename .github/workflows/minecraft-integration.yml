name: Minecraft integration

on:
  workflow_dispatch:
    inputs:
      accept_minecraft_eula:
        description: I have read and accept the Minecraft EULA for this integration run.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: minecraft-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vanilla:
    name: Minecraft Java Edition 26.2 server and client
    runs-on: [self-hosted, macOS, packwright-client-capture]
    timeout-minutes: 180
    environment: minecraft-client-capture
    steps:
      - name: Require explicit EULA acceptance
        if: ${{ inputs.accept_minecraft_eula != true }}
        run: |
          echo "This workflow requires explicit acceptance of the Minecraft EULA." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Require a trusted interactive macOS graphical session
        shell: bash
        run: |
          if [[ "$(uname -s)" != "Darwin" ]]; then
            echo "Official client capture requires a trusted macOS runner." >&2
            exit 1
          fi
          runner_user="$(id -un)"
          console_user="$(stat -f '%Su' /dev/console)"
          if [[ "$console_user" != "$runner_user" ]]; then
            echo "Runner user '$runner_user' is not the active graphical console user '$console_user'." >&2
            exit 1
          fi
          if ! launchctl print "gui/$(id -u)" >/dev/null 2>&1; then
            echo "Runner has no active Aqua graphical bootstrap session." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild and verify the bundled capture mod
        working-directory: capture-mod
        run: |
          ./gradlew --no-daemon clean test build
          cmp build/libs/packwright-capture-mod-0.5.0.jar runtime/packwright-capture-mod-0.5.0.jar
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/packwright-gradle

      - name: Run explicit server and official-client acceptance tests
        run: npm run test:minecraft
        env:
          PACKWRIGHT_CACHE_DIR: ${{ runner.temp }}/packwright-cache
          PACKWRIGHT_ACCEPT_MINECRAFT_EULA: ${{ inputs.accept_minecraft_eula }}
          PACKWRIGHT_RUN_CLIENT_CAPTURE: 'true'

      # Never upload the cache, server jar, generated vanilla data, or logs as artifacts.
