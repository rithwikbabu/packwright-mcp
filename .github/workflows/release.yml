name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag to recover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const server = JSON.parse(fs.readFileSync("server.json", "utf8"));
          const version = process.env.RELEASE_TAG.replace(/^v/, "");
          const expectedPackage = "@rithwikbabu/packwright-mcp";
          const expectedMcpName = "io.github.rithwikbabu/packwright-mcp";

          const failures = [];
          if (pkg.name !== expectedPackage) failures.push("unexpected npm package name");
          if (pkg.version !== version) failures.push("tag does not match package.json version");
          if (pkg.mcpName !== expectedMcpName) failures.push("unexpected package.json mcpName");
          if (server.name !== expectedMcpName) failures.push("server.json name does not match mcpName");
          if (server.version !== version) failures.push("server.json version does not match tag");
          if (server.packages?.[0]?.identifier !== expectedPackage) failures.push("server.json package identifier does not match");
          if (server.packages?.[0]?.version !== version) failures.push("server.json package version does not match tag");
          if (typeof server.description !== "string" || server.description.length > 100) {
            failures.push("server.json description exceeds the MCP Registry 100-character limit");
          }

          if (failures.length > 0) {
            console.error(failures.join("\n"));
            process.exit(1);
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify bundled capture mod contents
        run: |
          capture_mod="capture-mod/runtime/packwright-capture-mod-0.5.0.jar"
          entries="$RUNNER_TEMP/packwright-capture-mod-entries.txt"
          test -f "$capture_mod"
          test "$(wc -c < "$capture_mod")" -le 16777216
          unzip -Z1 "$capture_mod" > "$entries"
          if rg -v '^(META-INF/($|MANIFEST\.MF$)|io/$|io/github/$|io/github/rithwikbabu/$|io/github/rithwikbabu/packwright(/|$)|fabric\.mod\.json$|packwright-capture\.mixins\.json$|LICENSE_packwright-capture-mod$)' "$entries"; then
            echo "The capture mod contains an unexpected entry." >&2
            exit 1
          fi
          metadata="$RUNNER_TEMP/packwright-capture-mod.json"
          unzip -p "$capture_mod" fabric.mod.json > "$metadata"
          node --input-type=module -e 'import fs from "node:fs"; const m=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (m.id !== "packwright_capture" || m.version !== "0.5.0" || m.environment !== "client" || m.depends?.fabricloader !== "=0.19.3" || m.depends?.minecraft !== "=26.2" || m.depends?.java !== ">=25") throw new Error("Unexpected capture-mod metadata");' "$metadata"

      - name: Create release staging directory
        run: mkdir release-package

      - name: Build release tarball
        run: npm pack --pack-destination release-package

      - name: Upload verified release tarball
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: release-package/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish npm, MCP Registry, and GitHub release
    needs: verify
    if: github.event_name == 'push' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out tagged metadata
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reconfirm immutable release source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_SHA"

      - name: Download verified release tarball
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release-package

      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.6.2

      - name: Check whether exact npm artifact already exists
        id: npm_version
        env:
          PACKAGE_NAME: '@rithwikbabu/packwright-mcp'
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";

          const name = process.env.PACKAGE_NAME;
          const version = process.env.PACKAGE_VERSION.replace(/^v/, "");
          const tarballs = fs.readdirSync("release-package").filter((entry) => entry.endsWith(".tgz"));
          if (tarballs.length !== 1) {
            console.error(`Expected exactly one verified tarball, found ${tarballs.length}`);
            process.exit(1);
          }
          const tarball = fs.readFileSync(`release-package/${tarballs[0]}`);
          const localIntegrity = `sha512-${crypto.createHash("sha512").update(tarball).digest("base64")}`;
          const encodedName = name.replace("/", "%2f");
          const response = await fetch(`https://registry.npmjs.org/${encodedName}/${version}`);
          if (response.status === 404) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "exists=false\n");
          } else if (response.ok) {
            const metadata = await response.json();
            if (metadata.dist?.integrity !== localIntegrity) {
              console.error(`Existing npm artifact integrity does not match the verified ${name}@${version} tarball`);
              process.exit(1);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "exists=true\n");
          } else {
            console.error(`npm Registry lookup failed with HTTP ${response.status}`);
            process.exit(1);
          }
          NODE

      - name: Publish package with npm trusted publishing
        if: steps.npm_version.outputs.exists != 'true'
        run: npm publish ./release-package/*.tgz --access public

      - name: Wait for npm package visibility
        env:
          PACKAGE_NAME: '@rithwikbabu/packwright-mcp'
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: |
          version="${PACKAGE_VERSION#v}"
          for attempt in {1..12}; do
            if npm view "${PACKAGE_NAME}@${version}" version >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "npm package did not become visible in time" >&2
          exit 1

      - name: Check whether MCP Registry version already exists
        id: mcp_version
        env:
          MCP_NAME: io.github.rithwikbabu/packwright-mcp
          MCP_VERSION: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const name = process.env.MCP_NAME;
          const version = process.env.MCP_VERSION.replace(/^v/, "");
          const url = new URL("https://registry.modelcontextprotocol.io/v0.1/servers");
          url.searchParams.set("search", name);
          const response = await fetch(url);
          if (!response.ok) {
            console.error(`MCP Registry lookup failed with HTTP ${response.status}`);
            process.exit(1);
          }
          const body = await response.json();
          const found = (body.servers ?? []).some((entry) => {
            const server = entry.server ?? entry;
            return server.name === name && server.version === version;
          });
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `exists=${found}\n`);
          NODE

      - name: Install verified MCP publisher
        if: steps.mcp_version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MCP_PUBLISHER_VERSION: v1.7.9
          MCP_PUBLISHER_SHA256: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
        run: |
          archive="$RUNNER_TEMP/mcp-publisher_linux_amd64.tar.gz"
          install_dir="$RUNNER_TEMP/mcp-publisher-bin"
          gh release download "$MCP_PUBLISHER_VERSION" \
            --repo modelcontextprotocol/registry \
            --pattern mcp-publisher_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' "$MCP_PUBLISHER_SHA256" "$archive" > "$RUNNER_TEMP/mcp-publisher.sha256"
          sha256sum --check "$RUNNER_TEMP/mcp-publisher.sha256"
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" mcp-publisher
          chmod +x "$install_dir/mcp-publisher"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Authenticate to MCP Registry with GitHub OIDC
        if: steps.mcp_version.outputs.exists != 'true'
        run: mcp-publisher login github-oidc

      - name: Publish MCP server metadata
        if: steps.mcp_version.outputs.exists != 'true'
        run: mcp-publisher publish

      - name: Verify MCP Registry entry
        env:
          MCP_NAME: io.github.rithwikbabu/packwright-mcp
          MCP_VERSION: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          const name = process.env.MCP_NAME;
          const version = process.env.MCP_VERSION.replace(/^v/, "");
          const url = new URL("https://registry.modelcontextprotocol.io/v0.1/servers");
          url.searchParams.set("search", name);

          for (let attempt = 0; attempt < 12; attempt += 1) {
            const response = await fetch(url);
            if (response.ok) {
              const body = await response.json();
              const found = (body.servers ?? []).some((entry) => {
                const server = entry.server ?? entry;
                return server.name === name && server.version === version;
              });
              if (found) process.exit(0);
            }
            await new Promise((resolve) => setTimeout(resolve, 5000));
          }

          console.error(`MCP Registry did not expose ${name}@${version} in time`);
          process.exit(1);
          NODE

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_SHA"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release already exists"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi

  recover:
    name: Recover MCP Registry and GitHub release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out corrected release metadata
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify recovery source and published npm artifact
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PACKAGE_NAME: '@rithwikbabu/packwright-mcp'
          MCP_NAME: io.github.rithwikbabu/packwright-mcp
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+$/.test(tag)) {
            console.error("release_tag must be an exact stable vMAJOR.MINOR.PATCH tag");
            process.exit(1);
          }

          const version = tag.slice(1);
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const server = JSON.parse(fs.readFileSync("server.json", "utf8"));
          const failures = [];
          if (pkg.name !== process.env.PACKAGE_NAME) failures.push("unexpected npm package name");
          if (pkg.version !== version) failures.push("package.json version does not match recovery tag");
          if (pkg.mcpName !== process.env.MCP_NAME) failures.push("unexpected package.json mcpName");
          if (server.name !== process.env.MCP_NAME) failures.push("server.json name does not match mcpName");
          if (server.version !== version) failures.push("server.json version does not match recovery tag");
          if (server.packages?.[0]?.identifier !== process.env.PACKAGE_NAME) failures.push("server.json package identifier does not match");
          if (server.packages?.[0]?.version !== version) failures.push("server.json package version does not match recovery tag");
          if (typeof server.description !== "string" || server.description.length > 100) {
            failures.push("server.json description exceeds the MCP Registry 100-character limit");
          }

          const encodedName = process.env.PACKAGE_NAME.replace("/", "%2f");
          const response = await fetch(`https://registry.npmjs.org/${encodedName}/${version}`);
          if (!response.ok) failures.push(`npm artifact is unavailable (HTTP ${response.status})`);

          if (failures.length > 0) {
            console.error(failures.join("\n"));
            process.exit(1);
          }
          NODE
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git merge-base --is-ancestor "${RELEASE_TAG}^{commit}" origin/main

      - name: Check whether MCP Registry version already exists
        id: mcp_version
        env:
          MCP_NAME: io.github.rithwikbabu/packwright-mcp
          MCP_VERSION: ${{ inputs.release_tag }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const name = process.env.MCP_NAME;
          const version = process.env.MCP_VERSION.replace(/^v/, "");
          const url = new URL("https://registry.modelcontextprotocol.io/v0.1/servers");
          url.searchParams.set("search", name);
          const response = await fetch(url);
          if (!response.ok) {
            console.error(`MCP Registry lookup failed with HTTP ${response.status}`);
            process.exit(1);
          }
          const body = await response.json();
          const found = (body.servers ?? []).some((entry) => {
            const server = entry.server ?? entry;
            return server.name === name && server.version === version;
          });
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `exists=${found}\n`);
          NODE

      - name: Install verified MCP publisher
        if: steps.mcp_version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MCP_PUBLISHER_VERSION: v1.7.9
          MCP_PUBLISHER_SHA256: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
        run: |
          archive="$RUNNER_TEMP/mcp-publisher_linux_amd64.tar.gz"
          install_dir="$RUNNER_TEMP/mcp-publisher-bin"
          gh release download "$MCP_PUBLISHER_VERSION" \
            --repo modelcontextprotocol/registry \
            --pattern mcp-publisher_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' "$MCP_PUBLISHER_SHA256" "$archive" > "$RUNNER_TEMP/mcp-publisher.sha256"
          sha256sum --check "$RUNNER_TEMP/mcp-publisher.sha256"
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" mcp-publisher
          chmod +x "$install_dir/mcp-publisher"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Authenticate to MCP Registry with GitHub OIDC
        if: steps.mcp_version.outputs.exists != 'true'
        run: mcp-publisher login github-oidc

      - name: Publish MCP server metadata
        if: steps.mcp_version.outputs.exists != 'true'
        run: mcp-publisher publish

      - name: Verify MCP Registry entry
        env:
          MCP_NAME: io.github.rithwikbabu/packwright-mcp
          MCP_VERSION: ${{ inputs.release_tag }}
        run: |
          node --input-type=module <<'NODE'
          const name = process.env.MCP_NAME;
          const version = process.env.MCP_VERSION.replace(/^v/, "");
          const url = new URL("https://registry.modelcontextprotocol.io/v0.1/servers");
          url.searchParams.set("search", name);

          for (let attempt = 0; attempt < 12; attempt += 1) {
            const response = await fetch(url);
            if (response.ok) {
              const body = await response.json();
              const found = (body.servers ?? []).some((entry) => {
                const server = entry.server ?? entry;
                return server.name === name && server.version === version;
              });
              if (found) process.exit(0);
            }
            await new Promise((resolve) => setTimeout(resolve, 5000));
          }

          console.error(`MCP Registry did not expose ${name}@${version} in time`);
          process.exit(1);
          NODE

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release already exists"
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
