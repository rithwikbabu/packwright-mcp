name: Bug report
description: Report a reproducible Packwright problem.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include secrets, private datapacks, personal data, or Minecraft artifacts. Report security vulnerabilities privately through the Security tab instead.

  - type: input
    id: version
    attributes:
      label: Packwright version
      placeholder: Output of packwright-mcp --version
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - MCP stdio server
        - CLI
        - Structural validation
        - External Spyglass adapter
        - Vanilla setup or GameTest
        - Deterministic build
        - Documentation
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include sanitized inputs and commands. Replace private paths and content.
      render: text
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node version, and Java version when applicable.
      placeholder: macOS 15, Node 24.4.0, Java 25
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostics
      description: Paste bounded stderr or structured diagnostics after removing usernames, paths, and private content.
      render: text

  - type: checkboxes
    id: confirmation
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report does not disclose a security vulnerability or private data.
          required: true
