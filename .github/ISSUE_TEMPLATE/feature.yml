name: Feature request
description: Propose a focused Packwright capability or interface improvement.
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What datapack-development need is not met today?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe user-visible behavior, not only an implementation.
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - MCP tool, resource, or prompt
        - CLI
        - Datapack authoring
        - Validation or lookup
        - Vanilla GameTest
        - Packaging
        - Version support
        - Documentation
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Safety and compatibility considerations
      description: Consider path access, destructive changes, network/process access, schema compatibility, and Minecraft versions.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
